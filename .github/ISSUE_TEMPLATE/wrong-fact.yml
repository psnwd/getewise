name: A skill says something wrong
description: A fact, endpoint, fee or code sample in a gateway skill is incorrect or outdated
labels: [bug]
body:
  - type: dropdown
    id: gateway
    attributes:
      label: Gateway
      options: [PayHere, OnePay, WebXPay, Other]
    validations: { required: true }
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong?
      description: Quote the line or file (e.g. skills/payhere/references/refund.md).
    validations: { required: true }
  - type: input
    id: source
    attributes:
      label: Official docs link showing the correct fact
    validations: { required: true }
